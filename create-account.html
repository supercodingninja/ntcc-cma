<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Admin Account - NTCCA Legacy</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 500px;
      width: 100%;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    p {
      color: #666;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e1e8ed;
      border-radius: 10px;
      font-size: 16px;
      transition: all 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .message {
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
    }
    .message.error {
      background: #fee;
      color: #c00;
      border: 1px solid #fcc;
    }
    .message.success {
      background: #efe;
      color: #060;
      border: 1px solid #cfc;
    }
    .message.show {
      display: block;
    }
    .info {
      background: #e3f2fd;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      border-left: 4px solid #2196F3;
    }
    .info strong {
      color: #1976D2;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎵 Create Admin Account</h1>
    <p>NTCCA Legacy Music Management</p>

    <div class="info">
      <strong>Account Email:</strong> scn@scn.ninja<br>
      <small>This will create your admin account with this email.</small>
    </div>

    <div id="message" class="message"></div>

    <form id="signupForm">
      <div class="form-group">
        <label for="password">Set Your Password</label>
        <input
          type="password"
          id="password"
          placeholder="Choose a secure password (min 6 characters)"
          required
          minlength="6"
        >
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="Re-enter your password"
          required
          minlength="6"
        >
      </div>

      <button type="submit" id="submitBtn">Create Admin Account</button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = 'https://fozsbkbfwofycvhrmkqy.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvenNia2Jmd29meWN2aHJta3F5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI3MTcxNDksImV4cCI6MjA3ODI5MzE0OX0.1nyd5SLS1Zef8AhWrvV1l9prXeXHdHXNTditsniwe0U';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('signupForm');
    const message = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    function showMessage(text, type) {
      message.textContent = text;
      message.className = `message ${type} show`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        showMessage('Passwords do not match!', 'error');
        return;
      }

      if (password.length < 6) {
        showMessage('Password must be at least 6 characters long!', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating Account...';

      try {
        const { data, error } = await supabase.auth.signUp({
          email: 'scn@scn.ninja',
          password: password,
          options: {
            data: {
              full_name: 'SCN Admin'
            }
          }
        });

        if (error) throw error;

        showMessage('✅ Account created successfully! Redirecting to login...', 'success');

        setTimeout(() => {
          window.location.href = '/';
        }, 2000);

      } catch (error) {
        console.error('Error:', error);
        showMessage(`Error: ${error.message}`, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Admin Account';
      }
    });
  </script>
</body>
</html>

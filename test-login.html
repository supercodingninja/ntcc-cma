<!DOCTYPE html>
<html>
<head>
  <title>Test Login</title>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

    const supabaseUrl = 'https://fozsbkbfwofycvhrmkqy.supabase.co'
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvenNia2Jmd29meWN2aHJta3F5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI3MTcxNDksImV4cCI6MjA3ODI5MzE0OX0.1nyd5SLS1Zef8AhWrvV1l9prXeXHdHXNTditsniwe0U'

    const supabase = createClient(supabaseUrl, supabaseKey)

    async function testLogin() {
      console.log('Testing login...')

      // First, clear any existing session
      await supabase.auth.signOut()
      console.log('Signed out')

      // Try to login
      const { data, error } = await supabase.auth.signInWithPassword({
        email: 'admin@demo.com',
        password: 'demo123'
      })

      if (error) {
        console.error('Login error:', error)
        document.getElementById('result').innerHTML = `<div style="color: red;">Error: ${error.message}</div>`
        return
      }

      console.log('Login successful:', data)

      // Try to fetch profile
      const { data: profile, error: profileError } = await supabase
        .from('profiles')
        .select('*')
        .eq('id', data.user.id)
        .maybeSingle()

      if (profileError) {
        console.error('Profile error:', profileError)
        document.getElementById('result').innerHTML = `<div style="color: red;">Profile Error: ${profileError.message}</div>`
        return
      }

      console.log('Profile:', profile)
      document.getElementById('result').innerHTML = `<div style="color: green;">Success! Logged in as ${profile.email} with role ${profile.role}</div>`
    }

    window.testLogin = testLogin
  </script>
</head>
<body>
  <h1>Test Supabase Login</h1>
  <button onclick="testLogin()">Test Login</button>
  <div id="result"></div>
</body>
</html>

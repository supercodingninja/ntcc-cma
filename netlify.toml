# This Area Of Code Is: Netlify Deployment Configuration
# 
# Explanation: This file tells Netlify how to build and deploy the NTCC Music App.
# It configures the build command, output directory, redirects, headers for security,
# and environment variables including Supabase credentials. Netlify reads this file
# automatically on every deploy from the connected GitHub repository.
#
# In Other Words: This is the instruction manual for Netlify so it knows how to
# turn the code into a live website and keep it secure.

[build]
  # Build command runs Vite to bundle the React/TypeScript app into static files
  command = "npm run build"
  # Directory containing the built output that Netlify serves
  publish = "dist"
  # Node.js version for build environment
  environment = { NODE_VERSION = "20" }

# This Area Of Code Is: SPA Redirect Rules
#
# Explanation: Single Page Applications (SPAs) handle routing client-side in JavaScript.
# Without this rule, refreshing a page like /dashboard would return a 404 because the
# server doesn't have a physical /dashboard/index.html file. This redirect sends ALL
# routes back to index.html so React Router can handle the path correctly.
#
# In Other Words: Makes sure the app works when you hit refresh or share a link,
# not just when clicking buttons inside the app.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# This Area Of Code Is: Security Headers
#
# Explanation: HTTP headers that protect the app from common web attacks.
# X-Frame-Options prevents clickjacking. X-Content-Type-Options prevents MIME sniffing.
# Referrer-Policy controls what info is sent with outbound links. These are applied
# to all deployed files for security hardening.
#
# In Other Words: These are digital security guards that keep bad actors from
# tricking the app or stealing information.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# This Area Of Code Is: Supabase Environment Variables
#
# Explanation: These are the ONLY Supabase credentials used throughout the entire app.
# The URL points to the NTCC Music App Supabase project. The anon key is the public
